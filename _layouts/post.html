---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow"><a href="{{ site.baseurl }}/blog/">← Updates</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="post-body prose">
    {{ content }}
  </div>
</article>
