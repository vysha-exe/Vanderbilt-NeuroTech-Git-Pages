---
layout: default
---
<div class="page-intro">
  <h1>{{ page.title }}</h1>
  <p class="lede">Moments from meetings, builds, and events.</p>
</div>

{% if site.data.gallery.items and site.data.gallery.items.size > 0 %}
{% assign items = site.data.gallery.items %}
<div class="gallery-grid">
  {% for item in items %}
  <figure class="gallery-item">
    <a href="{{ item.file | relative_url }}" class="gallery-thumb" target="_blank" rel="noopener">
      <img src="{{ item.file | relative_url }}" alt="{{ item.caption | default: 'Club photo' | escape }}" width="800" height="600" loading="lazy">
    </a>
    {% if item.caption %}
    <figcaption>{{ item.caption }}</figcaption>
    {% endif %}
  </figure>
  {% endfor %}
</div>
{% else %}
<p class="empty-hint gallery-empty">Photos coming soon.</p>
{% endif %}
