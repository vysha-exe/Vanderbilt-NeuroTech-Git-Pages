title: Vanderbilt NeuroTech
description: Vanderbilt's student organization at the intersection of neuroscience and technology.
url: https://vysha-exe.github.io
baseurl: /Vanderbilt-NeuroTech-Git-Pages
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
